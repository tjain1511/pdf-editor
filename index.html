    <meta name="description" content="Edit PDFs directly in your browser. Files never leave your device." />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('pdf-editor-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
